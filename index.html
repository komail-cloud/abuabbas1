
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHrcEY6n-J7za-4bPN8sYwnU6EauslTug",
  authDomain: "abu-abbas.firebaseapp.com",
  databaseURL: "https://abu-abbas-default-rtdb.firebaseio.com",
  projectId: "abu-abbas",
  storageBucket: "abu-abbas.firebasestorage.app",
  messagingSenderId: "863423401268",
  appId: "1:863423401268:web:e89111c6503f80caa82961",
  measurementId: "G-Y2299RY8T5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("loginError");

  error.textContent = "";

  if (!email || !password) {
    error.textContent = "أدخل البريد الإلكتروني وكلمة المرور";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    const messages = {
      "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة",
      "auth/user-not-found": "الحساب غير موجود",
      "auth/wrong-password": "كلمة المرور غير صحيحة",
      "auth/invalid-email": "البريد الإلكتروني غير صحيح",
      "auth/too-many-requests": "محاولات كثيرة، حاول لاحقاً",
      "auth/network-request-failed": "تحقق من اتصال الإنترنت"
    };

    error.textContent =
      messages[e.code] || "تعذر تسجيل الدخول: " + e.message;
  }
};

window.logout = async function () {
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    document.getElementById("userName").textContent =
      user.email || "المستخدم";
  } else {
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
  }
});
</script>
