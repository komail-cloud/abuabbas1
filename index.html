<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبو عباس للنجارة</title>
<style>
:root{--gold:#d6b45c;--gold2:#f3d98b;--bg:#101010;--panel:#1b1b1b;--muted:#aaa;--border:#38322a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:var(--gold);color:#17130a;font-weight:bold}button:hover{background:var(--gold2)}button.secondary{background:#343434;color:#fff}button.danger{background:#7b2929;color:white}.hidden{display:none!important}.wrap{max-width:1000px;margin:auto;padding:20px}.header{text-align:center;padding:24px 10px 16px}.header h1{margin:0;color:var(--gold);font-size:clamp(25px,5vw,36px)}.header p{color:var(--muted);margin:9px 0 0}.status{font-size:12px;color:var(--muted);text-align:center;margin:0 0 18px}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:700px;margin:32px auto}.home-card{min-height:155px;background:var(--panel);border:1px solid var(--border);border-radius:18px;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:20px}.home-card span{font-size:36px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:20px;margin:16px 0}.panel h2{color:var(--gold);font-size:20px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}label{display:block;font-size:14px;color:#ddd;margin:8px 0 5px}input,select,textarea{width:100%;padding:12px;margin:0 0 12px;background:#111;color:white;border:1px solid #494235;border-radius:9px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}input[readonly]{color:#d6b45c;background:#191919}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.search{max-width:450px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:11px 9px;border-bottom:1px solid #383838;text-align:right;font-size:13px}th{color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:24px}.invoice-paper{background:white;color:#111;padding:25px;border-radius:8px}.invoice-paper h2{color:#8a6825}.invoice-paper hr{border:0;border-top:1px solid #ddd;margin:16px 0}.muted{color:var(--muted);font-size:13px}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;background:#17452d;color:#9af0b8}
@media(max-width:650px){.wrap{padding:13px}.home-grid{gap:10px;margin:24px auto}.home-card{min-height:135px;font-size:17px;padding:10px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}}
@media print{body{background:white}.no-print{display:none!important}.wrap{padding:0}.screen{display:none!important}#printArea{display:block!important}.invoice-paper{border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
 <header class="header"><h1>أبو عباس للنجارة</h1><p>نظام الفواتير</p></header>
 <div id="syncStatus" class="status">جاري الاتصال بقاعدة البيانات...</div>
 <main id="homePage" class="screen">
  <div class="home-grid">
   <button class="home-card" onclick="openNewInvoice()"><span>＋</span>فاتورة جديدة</button>
   <button class="home-card" onclick="openSearch()"><span>⌕</span>بحث عن الفاتورة</button>
  </div>
 </main>
 <section id="newPage" class="screen hidden">
  <div class="top-actions no-print"><h2 style="color:var(--gold)">فاتورة جديدة</h2><button class="secondary" onclick="goHome()">الرئيسية</button></div>
  <div class="panel">
   <form id="invoiceForm" onsubmit="saveInvoice(event)">
    <input type="hidden" id="invoiceId">
    <div class="form-grid">
     <div><label>رقم الفاتورة</label><input id="invoiceNumber" readonly></div>
     <div><label>التاريخ والوقت</label><input id="dateTime" readonly></div>
     <div><label>اسم الزبون</label><input id="customer" required placeholder="اسم الزبون"></div>
     <div><label>رقم الهاتف</label><input id="phone" inputmode="tel" placeholder="رقم الهاتف"></div>
     <div><label>المنطقة (اختياري)</label><select id="region"><option value="">اختر المنطقة (اختياري)</option></select></div>
     <div><label>قيمة الفاتورة (د.ب)</label><input id="total" type="number" min="0.001" step="0.001" required placeholder="0.000"></div>
     <div><label>المبلغ المدفوع (د.ب)</label><input id="paid" type="number" min="0" step="0.001" value="0" required></div>
     <div><label>طريقة الدفع</label><select id="method"><option value="كاش">كاش</option><option value="بنفت">بنفت</option></select></div>
     <div class="full"><label>تفاصيل العمل / الطلب</label><textarea id="details" rows="4" required placeholder="اكتب تفاصيل العمل"></textarea></div>
    </div>
    <div class="actions"><button type="submit">حفظ الفاتورة</button><button type="button" class="secondary" onclick="resetForm()">إلغاء</button></div>
   </form>
  </div>
 </section>
 <section id="searchPage" class="screen hidden">
  <div class="top-actions no-print"><h2 style="color:var(--gold)">بحث عن الفاتورة</h2><button class="secondary" onclick="goHome()">الرئيسية</button></div>
  <div class="panel"><input id="searchInput" class="search" placeholder="ابحث برقم الفاتورة أو اسم الزبون أو الهاتف..." oninput="renderInvoices()"><div id="invoiceList"></div></div>
 </section>
 <section id="viewPage" class="screen hidden">
  <div class="top-actions no-print"><h2 style="color:var(--gold)">تفاصيل الفاتورة</h2><button class="secondary" onclick="openSearch()">رجوع للبحث</button></div>
  <div id="invoiceView"></div>
 </section>
 <section id="printArea" class="hidden"></section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
// إعدادات مشروع Firebase نفسه للحفاظ على رابط الموقع الحالي
const firebaseConfig={apiKey:"AIzaSyBHrcEY6n-J7za-4bPN8sYwnU6EauslTug",authDomain:"abu-abbas.firebaseapp.com",databaseURL:"https://abu-abbas-default-rtdb.firebaseio.com",projectId:"abu-abbas",storageBucket:"abu-abbas.firebasestorage.app",messagingSenderId:"863423401268",appId:"1:863423401268:web:e89111c6503f80caa82961",measurementId:"G-Y2299RY8T5"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
// مسار جديد مستقل حتى لا نلمس أي بيانات قديمة
const invoicesRef=db.ref('sharedInvoices');
let invoices={};
const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toFixed(3)+' د.ب';
const regions=['المنامة','الحورة','القضيبية','العدلية','الجفير','السيف','السنابس','الدراز','البديع','الجنبية','سار','السهلة الشمالية','السهلة الجنوبية','جدحفص','البلاد القديم','الزنج','عذاري','توبلي','مدينة عيسى','مدينة حمد','الرفاع','الرفاع الشرقي','الرفاع الغربي','عالي','سلماباد','سترة','الخارجية','واديان','المعامير','العكر','نويدرات','القرية','المالكية','كرزكان','دمستان','صدد','شهركان','دار كليب','بني جمرة','باربار','أبو صيبع','مقابة','الشاخورة','جنوسان','الدير','سماهيج','عراد','المحرق','الحد','قلالي','البسيتين','المنامة الجديدة','رأس رمان','السنابس','كرانة','القريّة','الزلاق','الصخير','عسكر','جو','الدور','البحير','الرفاع فيوز','النويدرات','أم الحصم','ماحوز','الماحوز','البلاد القديم','السهلة'];
regions.sort((a,b)=>a.localeCompare(b,'ar'));
regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;$('region').appendChild(o)});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(d=new Date()){return d.toLocaleString('ar-BH',{dateStyle:'medium',timeStyle:'short'})}
function numberLabel(){return 'AB-'+Date.now().toString().slice(-8)}
function show(id){['homePage','newPage','searchPage','viewPage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('printArea').classList.add('hidden');window.scrollTo(0,0)}
function goHome(){show('homePage')}
function openNewInvoice(){resetForm();show('newPage')}
function openSearch(){show('searchPage');renderInvoices()}
function resetForm(){$('invoiceForm').reset();$('invoiceId').value='';$('invoiceNumber').value=numberLabel();$('dateTime').value=dateLabel();$('paid').value='0';$('region').value=''}
function renderInvoices(){const q=($('searchInput').value||'').trim().toLowerCase();const arr=Object.entries(invoices).map(([id,v])=>({id,...v})).filter(v=>[v.number,v.customer,v.phone].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('invoiceList').innerHTML=arr.length?`<div class="table-wrap"><table><thead><tr><th>رقم الفاتورة</th><th>الزبون</th><th>المنطقة</th><th>التاريخ والوقت</th><th>الإجمالي</th><th>المتبقي</th><th>عرض</th></tr></thead><tbody>${arr.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(i.customer)}</td><td>${esc(i.region||'-')}</td><td>${esc(i.dateTime||'')}</td><td>${money(i.total)}</td><td>${money(Math.max(0,(+i.total||0)-(+i.paid||0)))}</td><td><button class="small" onclick="viewInvoice('${i.id}')">فتح</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد فواتير مطابقة</div>'}
async function saveInvoice(e){e.preventDefault();const total=Number($('total').value),paid=Number($('paid').value);if(total<=0||paid<0||paid>total){alert('تأكد من قيمة الفاتورة والمبلغ المدفوع.');return}const id=$('invoiceId').value||invoicesRef.push().key;const old=invoices[id]||{};const item={number:old.number||$('invoiceNumber').value||numberLabel(),customer:$('customer').value.trim(),phone:$('phone').value.trim(),region:$('region').value,details:$('details').value.trim(),total,paid,method:paid>0?$('method').value:'لم يدفع',dateTime:old.dateTime||$('dateTime').value,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()};try{await invoicesRef.child(id).set(item);alert('تم حفظ الفاتورة، وستظهر على الكمبيوتر والتلفون عند استخدام الرابط نفسه.');resetForm();openSearch()}catch(err){alert('تعذر الحفظ. تأكد من قواعد Realtime Database والاتصال بالإنترنت.\n'+err.message)}}
function viewInvoice(id){const i=invoices[id];if(!i)return;const remaining=Math.max(0,(+i.total||0)-(+i.paid||0));$('invoiceView').innerHTML=`<div class="panel"><div id="paper" class="invoice-paper"><h2>أبو عباس للنجارة</h2><h3>فاتورة رقم: ${esc(i.number)}</h3><p>التاريخ والوقت: ${esc(i.dateTime)}</p><hr><p>اسم الزبون: ${esc(i.customer)}</p><p>رقم الهاتف: ${esc(i.phone||'-')}</p><p>المنطقة: ${esc(i.region||'-')}</p><hr><p>تفاصيل العمل: ${esc(i.details)}</p><hr><p>إجمالي الفاتورة: <b>${money(i.total)}</b></p><p>المدفوع: <b>${money(i.paid)}</b></p><p>طريقة الدفع: <b>${esc(i.method||'لم يدفع')}</b></p><p>المتبقي: <b>${money(remaining)}</b></p><hr><p>شكراً لتعاملكم معنا</p></div><div class="actions no-print"><button onclick="printInvoice()">طباعة الفاتورة</button><button class="secondary" onclick="editInvoice('${id}')">تعديل</button><button class="danger" onclick="deleteInvoice('${id}')">حذف</button></div></div>`;show('viewPage')}
function printInvoice(){const paper=$('paper');if(!paper)return;const w=window.open('','_blank');w.document.write('<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>فاتورة أبو عباس</title><style>body{font-family:Tahoma,Arial;padding:25px}.invoice-paper{max-width:750px;margin:auto}h2{color:#8a6825}hr{border:0;border-top:1px solid #ddd;margin:16px 0}</style></head><body>'+paper.outerHTML+'</body></html>');w.document.close();w.focus();w.print()}
function editInvoice(id){const i=invoices[id];if(!i)return;$('invoiceId').value=id;$('invoiceNumber').value=i.number;$('dateTime').value=i.dateTime;$('customer').value=i.customer||'';$('phone').value=i.phone||'';$('region').value=i.region||'';$('total').value=i.total;$('paid').value=i.paid||0;$('method').value=i.method==='بنفت'?'بنفت':'كاش';$('details').value=i.details||'';show('newPage')}
async function deleteInvoice(id){if(!confirm('هل تريد حذف هذه الفاتورة نهائياً؟'))return;try{await invoicesRef.child(id).remove();alert('تم حذف الفاتورة');openSearch()}catch(e){alert('تعذر الحذف: '+e.message)}}
invoicesRef.on('value',snap=>{invoices=snap.val()||{};$('syncStatus').textContent='متصل — تتم مزامنة الفواتير تلقائياً بين الأجهزة';if(!$('searchPage').classList.contains('hidden'))renderInvoices()},err=>{$('syncStatus').textContent='تعذر الاتصال: '+err.message+' — راجع قواعد قاعدة البيانات'});
resetForm();
</script>
</body>
</html>
