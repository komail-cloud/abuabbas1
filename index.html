
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبو عباس</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #101010;
  color: #f5d36a;
}

.page { display: none; min-height: 100vh; }
.page.active { display: block; }

.home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 25px;
  text-align: center;
  padding: 25px;
  background: radial-gradient(
    circle, #38301a, #141414 70%
  );
}

.home img {
  width: min(390px, 85vw);
  max-height: 40vh;
  object-fit: contain;
}

.home h1 {
  font-size: clamp(55px, 9vw, 95px);
  color: #ffda58;
  margin: 0;
}

.home-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
  margin-top: 20px;
}

.home-buttons button {
  min-width: 230px;
  min-height: 95px;
  font-size: 23px;
}

button {
  background: linear-gradient(135deg,#ffe67b,#c89219);
  color: #171717;
  border: 1px solid #e6bd45;
  border-radius: 10px;
  padding: 13px 22px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #ffe88a; }

.container {
  max-width: 950px;
  margin: 25px auto;
  padding: 28px;
  background: linear-gradient(145deg,#222,#111);
  border: 2px solid #bd922e;
  border-radius: 15px;
}

.toolbar, .actions {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin: 25px 0;
}

.actions { justify-content: center; }

.actions button {
  min-width: 165px;
  margin: 0;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}

.header h1 {
  font-size: 46px;
  color: #ffda58;
}

.header img {
  width: 230px;
  max-width: 45%;
  height: auto;
}

h2 {
  text-align: center;
  color: #ffda58;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 18px;
}

.field { flex: 1; min-width: 0; }

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  background: #fff9e8;
  color: #111;
  border: 2px solid #c99a24;
  border-radius: 8px;
  font: inherit;
}

.responsible {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid #a88129;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background: #fff;
  color: #111;
}

th, td {
  border: 1px solid #777;
  padding: 9px;
  text-align: center;
}

th {
  background: #d5a52c;
  color: #111;
}

td input {
  min-width: 65px;
  padding: 7px;
}

.total {
  font-size: 25px;
  font-weight: bold;
  margin: 25px 0;
}

.contact {
  text-align: center;
  padding: 22px;
  margin-top: 30px;
  border-top: 2px solid #d5a52c;
  font-weight: bold;
}

.phones {
  font-size: 21px;
  margin-top: 12px;
  direction: ltr;
}

.saved-item {
  padding: 15px;
  border-bottom: 1px solid #a88129;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

@media(max-width:600px) {
  .container { margin: 5px; padding: 13px; }
  .row { flex-direction: column; }
  .header h1 { font-size: 32px; }
  .header img { width: 160px; }
  table { font-size: 12px; }
  td input { padding: 5px; }
  .actions button { width: 100%; }
}

@media print {
  @page { size: A4; margin: 12mm; }

  body {
    background: white !important;
    color: black !important;
  }

  .page { display: none !important; }

  #invoicePage {
    display: block !important;
    min-height: 0;
  }

  .container {
    margin: 0;
    padding: 0;
    border: none;
    background: white !important;
    max-width: none;
  }

  .no-print { display: none !important; }

  h1, h2, label, .total, .contact {
    color: black !important;
  }

  input, textarea {
    background: white !important;
    color: black !important;
    border: 1px solid #555 !important;
    padding: 7px;
  }

  th, td {
    border: 1px solid black !important;
  }

  th {
    background: #eee !important;
    color: black !important;
  }

  .row { flex-direction: row; }

  tr, .header, .contact {
    break-inside: avoid;
  }
}
</style>
</head>
<body>

<!-- الصفحة الرئيسية -->
<section id="homePage" class="page active">
  <div class="home">
    <img src="logo.jpg" alt="شعار أبو عباس">
    <h1>أبو عباس</h1>

    <div class="home-buttons">
      <button onclick="newInvoice();showPage('invoicePage')">
        فاتورة جديدة
      </button>
      <button onclick="showPage('searchPage')">
        بحث عن فاتورة
      </button>
    </div>
  </div>
</section>

<!-- صفحة الفاتورة -->
<section id="invoicePage" class="page">
<div class="container">

  <div class="toolbar no-print">
    <button onclick="showPage('homePage')">
      الصفحة الرئيسية
    </button>
    <button onclick="showPage('searchPage')">
      بحث عن فاتورة
    </button>
  </div>

  <div class="header">
    <h1>أبو عباس</h1>
    <img src="logo.jpg" alt="شعار أبو عباس">
  </div>

  <div class="row">
    <div class="field">
      <label>رقم الفاتورة</label>
      <input id="invoiceNumber">
    </div>
    <div class="field">
      <label>التاريخ</label>
      <input type="date" id="invoiceDate">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>اسم الزبون</label>
      <input id="customerName">
    </div>
    <div class="field">
      <label>رقم الهاتف</label>
      <input id="customerPhone">
    </div>
  </div>

  <div class="responsible">
    <div class="row">
      <div class="field">
        <label>اسم المسؤول</label>
      </div>
      <div class="field">
        <label>رقم المسؤول</label>
      </div>
    </div>
  </div>

  <h2>تفاصيل الفاتورة</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>السعر</th>
          <th>الإجمالي</th>
          <th class="no-print">حذف</th>
        </tr>
      </thead>
      <tbody id="items"></tbody>
    </table>
  </div>

  <div class="no-print">
    <button onclick="addItem()">إضافة صنف +</button>
  </div>

  <div class="total">
    المجموع:
    <span id="total">0.000</span> د.ب
  </div>

  <label>ملاحظات</label>
  <textarea id="notes" rows="3"></textarea>

  <div class="contact">
    <div>للاستفسار والتواصل</div>
    <div class="phones">39565630 - 33186137</div>
  </div>

  <div class="actions no-print">
    <button onclick="saveInvoice()">حفظ الفاتورة</button>
    <button onclick="window.print()">طباعة / حفظ PDF</button>
    <button onclick="newInvoice()">فاتورة جديدة</button>
  </div>

</div>
</section>

<!-- البحث عن الفواتير -->
<section id="searchPage" class="page">
<div class="container">

  <div class="toolbar">
    <button onclick="showPage('homePage')">
      الصفحة الرئيسية
    </button>
    <button onclick="newInvoice();showPage('invoicePage')">
      فاتورة جديدة
    </button>
  </div>

  <h2>بحث عن فاتورة</h2>

  <input id="search"
    placeholder="رقم الفاتورة أو اسم الزبون أو رقم الهاتف"
    oninput="showInvoices()">

  <div id="savedInvoices"></div>

</div>
</section>

<script>
const storageKey = "abu_abbas_invoices";
const sequenceKey = "abu_abbas_next_number";
let currentId = null;

const el = id => document.getElementById(id);

function showPage(id) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === id);
  });

  if (id === "searchPage") showInvoices();

  window.scrollTo(0, 0);
}

function getInvoices() {
  try {
    const data = JSON.parse(
      localStorage.getItem(storageKey) || "[]"
    );
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function addItem(item = {}) {
  const row = document.createElement("tr");

  row.innerHTML = `
    <td><input class="name" placeholder="الصنف"></td>
    <td><input class="qty" type="number"
      min="0" step="any"></td>
    <td><input class="price" type="number"
      min="0" step="0.001"></td>
    <td class="lineTotal">0.000</td>
    <td class="no-print">
      <button onclick="removeItem(this)">حذف</button>
    </td>
  `;

  el("items").appendChild(row);

  row.querySelector(".name").value = item.name || "";
  row.querySelector(".qty").value = item.qty ?? 1;
  row.querySelector(".price").value = item.price ?? 0;

  row.querySelectorAll("input").forEach(input => {
    input.addEventListener("input", calculateTotal);
  });

  calculateTotal();
}

function removeItem(button) {
  button.closest("tr").remove();
  calculateTotal();
}

function calculateTotal() {
  let total = 0;

  document.querySelectorAll("#items tr").forEach(row => {
    const qty = Number(
      row.querySelector(".qty").value
    ) || 0;

    const price = Number(
      row.querySelector(".price").value
    ) || 0;

    const lineTotal = qty * price;

    row.querySelector(".lineTotal").textContent =
      lineTotal.toFixed(3);

    total += lineTotal;
  });

  el("total").textContent = total.toFixed(3);
}

function nextInvoiceNumber() {
  const numbers = getInvoices()
    .map(invoice => Number(invoice.number))
    .filter(n => Number.isSafeInteger(n) && n > 0);

  const savedNext = Number(
    localStorage.getItem(sequenceKey) || 1
  );

  return Math.max(1, savedNext, ...numbers.map(n => n + 1));
}

function localDate() {
  const date = new Date();

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}

function newInvoice() {
  currentId = null;

  el("invoiceNumber").value =
    String(nextInvoiceNumber());

  el("invoiceDate").value = localDate();

  [
    "customerName",
    "customerPhone",
    "responsibleName",
    "responsiblePhone",
    "notes"
  ].forEach(id => el(id).value = "");

  el("items").innerHTML = "";
  addItem();
}

function collectItems() {
  return [...document.querySelectorAll("#items tr")]
    .map(row => ({
      name: row.querySelector(".name").value,
      qty: Number(row.querySelector(".qty").value) || 0,
      price: Number(row.querySelector(".price").value) || 0
    }));
}

function saveInvoice() {
  const invoices = getInvoices();

  const invoice = {
    id: currentId || String(Date.now()),
    number: el("invoiceNumber").value.trim(),
    date: el("invoiceDate").value,
    customer: el("customerName").value,
    phone: el("customerPhone").value,
    responsibleName: el("responsibleName").value,
    responsiblePhone: el("responsiblePhone").value,
    notes: el("notes").value,
    items: collectItems()
  };

  if (!invoice.number) {
    alert("يرجى إدخال رقم الفاتورة");
    return;
  }

  if (invoices.some(item =>
    String(item.number) === invoice.number &&
    String(item.id) !== String(invoice.id)
  )) {
    alert("رقم الفاتورة مستخدم مسبقاً");
    return;
  }

  const index = invoices.findIndex(item =>
    String(item.id) === String(invoice.id)
  );

  if (index >= 0) {
    invoices[index] = invoice;
  } else {
    invoices.unshift(invoice);
  }

  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(invoices)
    );

    const number = Number(invoice.number);

    if (Number.isSafeInteger(number) && number > 0) {
      localStorage.setItem(
        sequenceKey,
        String(Math.max(nextInvoiceNumber(), number + 1))
      );
    }

    currentId = invoice.id;
    alert("تم حفظ الفاتورة بنجاح");
  } catch {
    alert("تعذر حفظ الفاتورة");
  }
}

function showInvoices() {
  const search = el("search").value.trim().toLowerCase();
  const container = el("savedInvoices");

  container.replaceChildren();

  const invoices = getInvoices().filter(invoice =>
    [invoice.number, invoice.customer, invoice.phone]
      .some(value =>
        String(value ?? "").toLowerCase().includes(search)
      )
  );

  invoices.forEach(invoice => {
    const div = document.createElement("div");
    div.className = "saved-item";

    const title = document.createElement("span");
    title.textContent =
      invoice.number + " - " +
      (invoice.customer || "بدون اسم");

    const edit = document.createElement("button");
    edit.textContent = "فتح / تعديل";
    edit.onclick = () => loadInvoice(invoice.id);

    const remove = document.createElement("button");
    remove.textContent = "حذف";
    remove.onclick = () => deleteInvoice(invoice.id);

    div.append(title, edit, remove);
    container.appendChild(div);
  });
}

function loadInvoice(id) {
  const invoice = getInvoices().find(item =>
    String(item.id) === String(id)
  );

  if (!invoice) return;

  currentId = invoice.id;

  const fields = {
    invoiceNumber: invoice.number,
    invoiceDate: invoice.date,
    customerName: invoice.customer,
    customerPhone: invoice.phone,
    responsibleName: invoice.responsibleName,
    responsiblePhone: invoice.responsiblePhone,
    notes: invoice.notes
  };

  Object.entries(fields).forEach(([id, value]) => {
    el(id).value = value ?? "";
  });

  el("items").innerHTML = "";

  (invoice.items || []).forEach(item => addItem(item));

  calculateTotal();
  showPage("invoicePage");
}

function deleteInvoice(id) {
  if (!confirm("هل تريد حذف هذه الفاتورة؟")) return;

  const invoices = getInvoices().filter(item =>
    String(item.id) !== String(id)
  );

  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(invoices)
    );

    if (String(currentId) === String(id)) {
      currentId = null;
    }

    showInvoices();
  } catch {
    alert("تعذر حذف الفاتورة");
  }
}

newInvoice();
</script>
</body>
</html>
